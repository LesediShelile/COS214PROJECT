<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIVIDY · Workflow Theatre</title>
<style>
:root{--bg:#f3f5fa;--pn:#fff;--tx:#1b2333;--mu:#69758f;--ln:#cfd6e6;--a:#0a84ff;--d:#12a150;--f:#e5484d;--w:#d98200;--x:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1e;--pn:#121a30;--tx:#e6ebf7;--mu:#8793b2;--ln:#27324f;--a:#38bdf8;--d:#34d399;--f:#fb7185;--w:#fbbf24;--x:#a78bfa}}
:root[data-theme="dark"]{--bg:#0a0f1e;--pn:#121a30;--tx:#e6ebf7;--mu:#8793b2;--ln:#27324f;--a:#38bdf8;--d:#34d399;--f:#fb7185;--w:#fbbf24;--x:#a78bfa}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--ln);background:var(--pn)}
header b{letter-spacing:.14em}header i{color:var(--mu);font-style:normal}
button,select,textarea{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:5px 10px}
button{cursor:pointer}button:hover,button.on{border-color:var(--a);color:var(--a)}
main{flex:1;min-height:0;display:flex}
#st{flex:1;min-width:0;display:flex;flex-direction:column}
#cv{flex:1;min-height:0;width:100%;cursor:grab;touch-action:none;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--a) 8%,transparent),transparent 60%)}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--ln);background:var(--pn)}
#sl{flex:1;min-width:120px;accent-color:var(--a)}
aside{width:340px;border-left:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;min-height:0}
aside>div{padding:10px 14px;border-bottom:1px solid var(--ln)}
#met{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
#met span{display:block;font-size:20px;font-weight:600}#met small{color:var(--mu)}
#log{flex:1;overflow:auto;padding:0;margin:0;list-style:none;min-height:80px}
#log li{display:flex;gap:8px;padding:6px 14px;cursor:pointer;border-bottom:1px solid var(--ln);font-size:13px}
#log li:hover{background:color-mix(in srgb,var(--a) 8%,transparent)}
#log li.cur{background:color-mix(in srgb,var(--a) 16%,transparent)}
#log time{color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--mu)}
.s-a{--c:var(--a)}.s-d{--c:var(--d)}.s-f{--c:var(--f)}.s-w{--c:var(--w)}.s-x{--c:var(--x)}
.dot[class*="s-"]{background:var(--c)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--c,var(--ln));color:var(--c,var(--mu));font-size:12px}
details textarea{width:100%;box-sizing:border-box;height:90px;font:12px ui-monospace,monospace;margin-top:6px}
svg text{font:12px system-ui,sans-serif;fill:var(--tx);pointer-events:none;text-anchor:middle}
.lane{fill:var(--tx);opacity:.035}.lane.o{opacity:.07}.ll{fill:var(--mu)!important;text-anchor:start!important;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.e{fill:none;stroke:var(--ln);stroke-width:2}.e.ext{stroke-dasharray:3 5}.e.fl{stroke:var(--f);opacity:.25;stroke-dasharray:2 7}
.e.on{stroke:var(--a);stroke-dasharray:9 6;animation:dash .7s linear infinite}.e.dn{stroke:var(--d);opacity:.85}.e.fl.dn{stroke:var(--f);opacity:.9}
.n{cursor:pointer}.sh{fill:var(--pn);stroke:var(--ln);stroke-width:2;transition:fill .3s,stroke .3s}.n:hover .sh{stroke:var(--mu)}
.n.sel .sh{stroke-width:3.5}
.n.a .sh{stroke:var(--a);fill:color-mix(in srgb,var(--a) 18%,var(--pn));animation:pulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 9px var(--a))}
.n.d .sh{stroke:var(--d);fill:color-mix(in srgb,var(--d) 16%,var(--pn))}
.n.f .sh{stroke:var(--f);fill:color-mix(in srgb,var(--f) 18%,var(--pn));filter:drop-shadow(0 0 8px var(--f))}
.n.w .sh{stroke:var(--w);fill:color-mix(in srgb,var(--w) 18%,var(--pn));animation:pulse 2s ease-in-out infinite}
.n.x .sh{stroke:var(--x);fill:color-mix(in srgb,var(--x) 18%,var(--pn));stroke-dasharray:7 4;animation:dash .9s linear infinite;filter:drop-shadow(0 0 9px var(--x))}
.n.t0 .sh{stroke-dasharray:5 4}
.tk{fill:var(--a);filter:drop-shadow(0 0 6px var(--a))}.tk.f{fill:var(--f);filter:drop-shadow(0 0 6px var(--f))}.tk.x{fill:var(--x);filter:drop-shadow(0 0 6px var(--x))}
@keyframes dash{to{stroke-dashoffset:-30}}@keyframes pulse{50%{stroke-width:4.5}}
@media(max-width:820px){main{flex-direction:column}aside{width:auto;height:42%;border-left:0;border-top:1px solid var(--ln)}}
</style></head><body>
<header><b>TIVIDY</b><i>Workflow Theatre</i><span id="sc"></span><select id="vr" aria-label="Scenario variant"></select></header>
<main>
<section id="st"><svg id="cv"></svg>
<div id="bar"><button id="b0" title="Restart">⏮</button><button id="bp" title="Previous (←)">◀</button><button id="bg" title="Play / pause (space)">▶ Play</button><button id="bn" title="Next (→)">▶|</button>
<input id="sl" type="range" min="-1" value="-1"><select id="sp"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
<label><input id="fo" type="checkbox" checked> follow</label><button id="fi">Fit</button></div></section>
<aside>
<div id="met"><div><span id="m1">0</span><small>step</small></div><div><span id="m2">0</span><small>active</small></div><div><span id="m3">0</span><small>done</small></div><div><span id="m4">0</span><small>failed</small></div></div>
<div id="ins"></div>
<ol id="log"></ol>
<div><details><summary>Live event stream (JSONL)</summary>
<textarea id="jl" spellcheck="false">{"type":"TASK_STARTED","sourceID":"intake","details":"Intake started"}
{"type":"EXTERNAL_REQUEST","sourceID":"rec","details":"GET /records"}
{"type":"TASK_COMPLETED","sourceID":"intake","details":"Intake done"}</textarea>
<button id="jr" style="margin-top:6px">Replay stream on this scenario</button></details></div>
</aside></main>
<script>
const $=s=>document.querySelector(s),NS="http://www.w3.org/2000/svg";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a||{})e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const J=(...a)=>a.join("\n");
/* ---------- scenario data (from the two scenario PDFs) ---------- */
const HT=J("intake a Nurse intake and preparation","intake d Patient prepared","appr a Hospital admission approval requested","appr d Admission approved");
const ACC=J("accept a Awaiting doctor acceptance (deadline by priority)","accept d Dr Nkosi accepts the case");
const TREAT=J("assess a Assessment and treatment|rec x PUT /records/update","rec d Patient record updated","assess d Treatment complete","room a Doctor chooses room type","room d ICU required","rapp a ICU transfer approval requested","rapp d Approval granted","out d Outcome: transferred to ICU","clean a Room departure cleaning|arch x POST /records/archive","clean d Area cleaned|arch d Full history archived");
const WALK=J("route a New walk-in patient","route d Route = GENERAL","arr a Reception registration|rec x GET /records/history","rec d History retrieved","arr d Patient registered","triage a Nurse triage: vitals and priority","triage d Priority assigned");
const EM=J("route a Emergency call received","route d Route = EMERGENCY");
const LAW1=J("inq a Inquiry received (online)","inq d Inquiry logged","route a Choosing intake route","route d Route = STANDARD","ident a Verifying client identity","ident d Identity verified","docs a Collecting documents|conf a Conflict-of-interest check (parallel)|db x Searching conflict database","db d No matches found","conf d No conflict","clear a Compliance clearing the matter","clear d Conflict cleared","docs d All documents received");
const LAWEND=J("eval a Associate evaluates the case","eval d Recommends acceptance");
const LAWFEE=J("fee a Drafting fee estimate and engagement letter","fee d Estimate drafted","feeA a Contingency fee needs partner approval","feeA d Partner approves fee","sign a Client signs and pays retainer|bill x POST /invoice","bill d Payment confirmed","sign d Signed and paid","open a Opening matter","open d Assigned to commercial team","out d Outcome: matter opened and archived");
const S={
hospital:{name:"Hospital",
lanes:[["External systems",0],["Paramedic",1],["Secretary",2],["Nursing staff",3,2],["Doctor",5],["Cleaning",6]],
nodes:[["route","Admission route?",1,2,"d"],["pick","Pickup and transport",2,1,"t"],["disp","Ambulance dispatch",3,0,"e"],["arr","Reception registration",2,2,"t"],["regE","Register on arrival",3,2,"t"],["rec","Patient records",4,0,"e"],["prep","Bay preparation",3,3,"t"],["triage","Nurse triage",3,4,"t"],["crit","Critical?",4,4,"d"],["queue","Priority queue",5,4,"t"],["hand","Handover to nurse",5,3,"t"],["intake","Nurse intake",6,3,"t"],["appr","Admission approval",7,2,"a"],["accept","Doctor accepts case",8,5,"a"],["assess","Assessment and treatment",9,5,"t"],["room","Room allocation",10,5,"d"],["rapp","ICU / surgery approval",11,5,"a"],["out","Outcome",12,5,"s"],["clean","Departure cleaning",13,6,"t"],["arch","Records archive",13,0,"e"]],
edges:"route>pick route>prep route>arr pick>regE regE>hand prep>hand pick~disp regE~rec arr~rec arr>triage triage>crit crit>queue crit>hand queue>intake hand>intake intake>appr appr>accept accept>assess assess>room room>rapp room>out rapp>out out>clean out>arch pick!out prep!out",
runs:{"Emergency admission → ICU":J(EM,"pick a Paramedics collect the patient|prep a Bay prepared in parallel|disp x ← status: picked up","disp d Dispatch: en route","pick d Patient delivered","regE a Registering on arrival|rec x GET /records/history","rec d History retrieved","regE d Registration complete|prep d Bay ready","hand a Paramedic → nurse handover","hand d Handover complete",HT,ACC,TREAT),
"Walk-in turns critical":J(WALK,"crit a Critical condition check","crit f Critical! Moved onto emergency path","hand a Nurse takes the patient immediately","hand d Handover complete",HT,ACC,TREAT),
"Walk-in, doctor times out":J(WALK,"crit a Critical condition check","crit d Not critical","queue a Queue ordered by triage priority","queue d Patient called","intake a Nurse intake and preparation","intake d Patient prepared","appr a Hospital admission approval requested","appr d Admission approved","accept a Awaiting doctor acceptance","accept w No response in deadline: rerouted","accept a Another doctor notified","accept d Dr Mokoena accepts the case",TREAT),
"Transport fails":J(EM,"pick a Paramedics en route|prep a Room preparation started|disp x ← status update","disp f Dispatch: transport delayed","pick f Transport failed, hospital informed","prep w Preparation paused","prep f Preparation cancelled","out f Outcome: cancelled before arrival")}},
law:{name:"Law firm",
lanes:[["Intake coordinator",1],["Paralegal",2],["Compliance",3],["Associate",4],["Partner",5],["Billing clerk",6],["External systems",7]],
nodes:[["inq","Inquiry logged",0,1,"t"],["route","Intake route?",1,1,"d"],["ident","Verify identity",2,2,"t"],["docs","Collect documents",3,2,"t"],["conf","Conflict check",3,3,"t"],["db","Conflict database",3,7,"e"],["clear","Conflict clearance",4,3,"a"],["eval","Case evaluation",5,4,"t"],["acc","Case acceptance",6,5,"a"],["fee","Fee estimate and letter",7,4,"t"],["feeA","Fee approval",8,5,"a"],["sign","Sign and pay retainer",9,6,"t"],["bill","Billing system",9,7,"e"],["open","Open matter",10,6,"t"],["out","Outcome",11,6,"s"]],
edges:"inq>route route>ident ident>docs ident>conf conf~db conf>clear docs>eval clear>eval eval>acc acc>fee fee>feeA feeA>sign sign~bill sign>open open>out docs!out clear!out",
runs:{"Standard intake, partner escalation":J(LAW1,LAWEND,"acc a Associate → senior associate approval","acc w Senior associate silent: escalated","acc d Partner approves the case",LAWFEE),
"Conflict found, waiver refused":J("inq a Inquiry received (phone)","inq d Inquiry logged","route a Choosing intake route","route d Route = STANDARD","ident a Verifying client identity","ident d Identity verified","docs a Collecting documents|conf a Conflict check|db x Searching conflict database","db d Match: opposing party is a client","conf f Conflict of interest found","clear w Waiver requested from affected parties","clear f Waiver refused","out f Outcome: declined, non-engagement letter sent"),
"Urgent: court date close":J("inq a Inquiry received (referral)","inq d Inquiry logged","route a Legal time limit check","route d URGENT: hearing in 3 days","ident a Fast-track identity check","ident d Identity verified","docs a Collecting documents|conf a Conflict check|db x Searching conflict database","db d No matches found","conf d No conflict","clear d Conflict cleared","docs d Documents received",LAWEND,"acc a Time limit expiring: straight to partner","acc d Partner approves immediately",LAWFEE),
"Documents never arrive":J("inq a Inquiry received (walk-in)","inq d Inquiry logged","route a Choosing intake route","route d Route = STANDARD","ident a Verifying client identity","ident d Identity verified","docs a Collecting documents","docs w Deadline passed: reminder sent","docs f Still nothing: intake closed","out f Outcome: withdrawn")}}};
/* ---------- engine ---------- */
const CW=150,RH=74,X0=170,Y0=60,NW=124,NH=46;
let sc,key="hospital",NODE,EDGES,steps,cur=-1,sel=null,playing=false,timer,speed=1,follow=true,tg=null,cam={x:0,y:0,w:1200},tokens=[],nodeEl={},edgeEl={};
const cv=$("#cv"),gL=el("g",{},cv),gE=el("g",{},cv),gN=el("g",{},cv),gT=el("g",{},cv);
const pos=n=>({x:X0+n[2]*CW,y:Y0+n[3]*RH});
const parse=t=>t.split("\n").map(l=>l.split("|").map(s=>{const m=/^(\w+) ([adfwx]) (.*)$/.exec(s.trim());return m&&NODE[m[1]]?{id:m[1],s:m[2],t:m[3]}:null}).filter(Boolean)).filter(a=>a.length);
function geo(a,b){const p=pos(NODE[a]),q=pos(NODE[b]);let sx=p.x+NW/2,tx=q.x-NW/2;
 if(q.x-p.x<80){const sg=q.y>p.y?1:-1;return`M${p.x} ${p.y+sg*NH/2}C${p.x} ${p.y+sg*70} ${q.x} ${q.y-sg*70} ${q.x} ${q.y-sg*NH/2}`}
 const dx=Math.max(40,(tx-sx)/2);return`M${sx} ${p.y}C${sx+dx} ${p.y} ${tx-dx} ${q.y} ${tx} ${q.y}`}
function shape(g,t){const o={class:"sh"};
 if(t==="d")return el("polygon",{...o,points:"-70,0 0,-33 70,0 0,33"},g);
 if(t==="a")return el("polygon",{...o,points:"-64,0 -46,-23 46,-23 64,0 46,23 -46,23"},g);
 return el("rect",{...o,x:-NW/2,y:-NH/2,width:NW,height:NH,rx:t==="t"?9:NH/2},g)}
function wrap(s){if(s.length<=16)return[s];let b=-1,d=99,m=s.length/2;for(let i=0;i<s.length;i++)if(s[i]===" "&&Math.abs(i-m)<d){d=Math.abs(i-m);b=i}return b<0?[s]:[s.slice(0,b),s.slice(b+1)]}
function build(){
 sc=S[key];NODE={};sc.nodes.forEach(n=>NODE[n[0]]=n);
 [gL,gE,gN,gT].forEach(g=>g.replaceChildren());nodeEl={};edgeEl={};tokens=[];
 const maxC=Math.max(...sc.nodes.map(n=>n[2]));
 sc.lanes.forEach((l,i)=>{const h=(l[2]||1)*RH;el("rect",{class:"lane"+(i%2?" o":""),x:0,y:Y0+l[1]*RH-RH/2,width:X0+(maxC+1)*CW,height:h},gL);
  const t=el("text",{class:"ll",x:12,y:Y0+l[1]*RH-RH/2+20},gL);t.textContent=l[0]});
 EDGES=sc.edges.split(" ").map(s=>{const m=/(\w+)([>~!])(\w+)/.exec(s);return{a:m[1],k:m[2],b:m[3],id:s}});
 EDGES.forEach(e=>{e.p=el("path",{class:"e"+(e.k==="~"?" ext":e.k==="!"?" fl":""),d:geo(e.a,e.b)},gE)});
 sc.nodes.forEach(n=>{const p=pos(n),g=el("g",{class:"n",transform:`translate(${p.x} ${p.y})`},gN);shape(g,n[4]);
  const ls=wrap(n[1]);ls.forEach((t,k)=>{el("text",{y:(k-(ls.length-1)/2)*14+4},g).textContent=t});
  g.onclick=()=>{if(!moved){sel=n[0];paint()}};nodeEl[n[0]]=g;if(n[4]==="e")g.classList.add("t0")});
 const vr=$("#vr");vr.replaceChildren();Object.keys(sc.runs).forEach(k=>vr.add(new Option(k,k)));
 $("#sc").replaceChildren(...Object.keys(S).map(k=>{const b=document.createElement("button");b.textContent=S[k].name;b.className=k===key?"on":"";b.onclick=()=>{key=k;build()};return b}));
 loadRun(Object.keys(sc.runs)[0]);fit()}
function loadRun(name){steps=parse(sc.runs[name]);$("#vr").value=name;stop();sel=null;cur=-1;$("#sl").max=steps.length-1;
 $("#log").replaceChildren(...steps.map((st,i)=>{const li=document.createElement("li"),c=st[0].s;
  li.innerHTML=`<span class="dot s-${c}"></span><time>T+${String(Math.floor(i*6/60)).padStart(2,"0")}:${String(i*6%60).padStart(2,"0")}</time><span></span>`;
  li.lastChild.textContent=st.map(x=>x.t).join(" · ");li.onclick=()=>go(i,false);return li}));paint()}
function replay(i){const st={},h={};for(let j=0;j<=i&&j<steps.length;j++)steps[j].forEach(it=>{st[it.id]=it.s;(h[it.id]=h[it.id]||[]).push([j,it.s,it.t])});return{st,h}}
function paint(){
 const{st,h}=replay(cur);let a=0,d=0,f=0;
 for(const id in nodeEl){const s=st[id]||"",g=nodeEl[id];g.setAttribute("class","n"+(s?" "+s:"")+(id===sel?" sel":"")+(NODE[id][4]==="e"&&!s?" t0":""));
  if(s==="a"||s==="x"||s==="w")a++;if(s==="d")d++;if(s==="f")f++}
 EDGES.forEach(e=>{const ss=st[e.a],ts=st[e.b];let c="e"+(e.k==="~"?" ext":e.k==="!"?" fl":"");
  if(e.k==="!"){if(ss==="f"&&ts)c+=" dn"}
  else if(e.k==="~"){if(ts==="x"&&ss==="a")c+=" on"}
  else if("dfw".includes(ss||"-")&&"axw".includes(ts||"-"))c+=" on";
  else if("dfw".includes(ss||"-")&&ts&&ts!=="a")c+=" dn";
  e.p.setAttribute("class",c)});
 $("#m1").textContent=(cur+1)+"/"+steps.length;$("#m2").textContent=a;$("#m3").textContent=d;$("#m4").textContent=f;$("#sl").value=cur;
 [...$("#log").children].forEach((li,i)=>li.classList.toggle("cur",i===cur));
 const c=$("#log").children[cur];c&&c.scrollIntoView({block:"nearest"});
 const n=sel&&NODE[sel],lane=n&&sc.lanes.find(l=>n[3]>=l[1]&&n[3]<l[1]+(l[2]||1));
 $("#ins").innerHTML=n?`<b></b> <span class="chip s-${st[sel]||""}">${({a:"active",d:"done",f:"failed",w:"waiting",x:"calling external system"})[st[sel]]||"idle"}</span><div style="color:var(--mu);margin:4px 0">${lane?lane[0]:""} · ${({t:"task",d:"decision",a:"approval",e:"external system",s:"outcome"})[n[4]]}</div><ul style="margin:0;padding-left:18px"></ul>`:`<span style="color:var(--mu)">Click any node to inspect it. Drag to pan, scroll to zoom, or click a log line to jump there.</span>`;
 if(n){$("#ins b").textContent=n[1];const u=$("#ins ul");(h[sel]||[]).forEach(x=>{const li=document.createElement("li");li.textContent=x[2];u.appendChild(li)})}
 if(follow)target(st)}
/* ---------- animation ---------- */
function fire(e,rev,cls){const len=e.p.getTotalLength();if(!len)return;const g=el("g",{},gT);
 [0,1,2].forEach(k=>el("circle",{class:"tk "+cls,r:6-k*1.6,opacity:1-k*.3},g));tokens.push({e,rev,len,g,t0:performance.now(),dur:750/speed})}
function animate(i,prev){const{st}=replay(i);steps[i].forEach(it=>{const n=it.id;
 if(it.s==="f")EDGES.filter(e=>e.k==="!"&&e.a===n).forEach(e=>fire(e,0,"f"));
 if(!prev[n])EDGES.filter(e=>e.k===">"&&e.b===n&&"dfw".includes(prev[e.a]||"-")).forEach(e=>fire(e,0,""));
 if(NODE[n][4]==="e")EDGES.filter(e=>e.k==="~"&&e.b===n&&st[e.a]==="a").forEach(e=>{if(it.s==="x")fire(e,0,"x");if(it.s==="d"||it.s==="f")fire(e,1,"x")})})}
function bbox(ids,m){let a=1e9,b=1e9,c=-1e9,d=-1e9;ids.forEach(id=>{const p=pos(NODE[id]);a=Math.min(a,p.x-NW);b=Math.min(b,p.y-NH);c=Math.max(c,p.x+NW);d=Math.max(d,p.y+NH)});return{x:a-m,y:b-m,w:c-a+2*m,h:d-b+2*m}}
const ar=()=>{const r=cv.getBoundingClientRect();return r.height/Math.max(1,r.width)};
function aim(b){const w=Math.max(b.w,b.h/ar());tg={x:b.x+b.w/2-w/2,y:b.y+b.h/2-w*ar()/2,w}}
function target(st){const ids=Object.keys(st).filter(k=>"axw".includes(st[k]));aim(bbox(ids.length?ids:Object.keys(NODE),ids.length?150:40));if(ids.length&&tg.w<760){const c=tg.x+tg.w/2,m=tg.y+tg.w*ar()/2;tg.w=760;tg.x=c-380;tg.y=m-380*ar()}}
function fit(){follow=false;$("#fo").checked=false;aim(bbox(Object.keys(NODE),30))}
function loop(now){tokens=tokens.filter(t=>{const u=(now-t.t0)/t.dur;if(u>=1){t.g.remove();return false}
  [...t.g.children].forEach((c,k)=>{const v=Math.max(0,u-k*.05),p=t.e.p.getPointAtLength((t.rev?1-v:v)*t.len);c.setAttribute("cx",p.x);c.setAttribute("cy",p.y)});return true});
 if(tg){cam.x+=(tg.x-cam.x)*.09;cam.y+=(tg.y-cam.y)*.09;cam.w+=(tg.w-cam.w)*.09}
 cv.setAttribute("viewBox",`${cam.x} ${cam.y} ${cam.w} ${cam.w*ar()}`);requestAnimationFrame(loop)}
/* ---------- playback ---------- */
function go(i,anim){i=Math.max(-1,Math.min(steps.length-1,i));const prev=i===cur+1&&anim?replay(cur).st:null;cur=i;paint();if(prev&&i>=0)animate(i,prev)}
function stop(){playing=false;clearTimeout(timer);$("#bg").textContent="▶ Play"}
function tick(){if(!playing)return;if(cur>=steps.length-1){stop();return}go(cur+1,true);timer=setTimeout(tick,1500/speed)}
function toggle(){if(playing)return stop();if(cur>=steps.length-1)go(-1,false);playing=true;$("#bg").textContent="⏸ Pause";tick()}
$("#bg").onclick=toggle;$("#b0").onclick=()=>{stop();go(-1,false)};$("#bn").onclick=()=>{stop();go(cur+1,true)};$("#bp").onclick=()=>{stop();go(cur-1,false)};
$("#sl").oninput=e=>{stop();go(+e.target.value,false)};$("#sp").onchange=e=>speed=+e.target.value;$("#vr").onchange=e=>loadRun(e.target.value);
$("#fo").onchange=e=>{follow=e.target.checked;if(follow)paint()};$("#fi").onclick=fit;
addEventListener("keydown",e=>{if(/TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.code==="Space"){e.preventDefault();toggle()}if(e.key==="ArrowRight"){stop();go(cur+1,true)}if(e.key==="ArrowLeft"){stop();go(cur-1,false)}});
/* pan + zoom */
let moved=false,drag=null;
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};moved=false};
addEventListener("pointerup",()=>drag=null);
addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4&&!moved){moved=true;tg=null;follow=false;$("#fo").checked=false}
 if(moved){const k=cam.w/cv.clientWidth;cam.x-=dx*k;cam.y-=dy*k;drag={x:e.clientX,y:e.clientY}}});
cv.onclick=e=>{if(!moved&&e.target===cv||e.target.classList&&e.target.classList.contains("lane")){sel=null;paint()}};
cv.addEventListener("wheel",e=>{e.preventDefault();tg=null;follow=false;$("#fo").checked=false;const r=cv.getBoundingClientRect(),f=e.deltaY>0?1.12:.89,mx=cam.x+(e.clientX-r.left)/r.width*cam.w,my=cam.y+(e.clientY-r.top)/r.height*cam.w*ar();
 cam.w*=f;cam.x=mx-(e.clientX-r.left)/r.width*cam.w;cam.y=my-(e.clientY-r.top)/r.height*cam.w*ar()},{passive:false});
/* live JSONL replay: same shape as WorkflowEvent {type, sourceID, timestamp, details} */
const mapS=t=>/FAIL|REJECT|CANCEL/i.test(t)?"f":/COMPLET|DONE|APPROVED/i.test(t)?"d":/EXTERNAL|REQUEST|API/i.test(t)?"x":/WAIT|APPROVAL|PENDING|ESCALAT/i.test(t)?"w":"a";
$("#jr").onclick=()=>{const rows=$("#jl").value.split("\n").map(l=>{try{const o=JSON.parse(l),id=o.sourceID||o.source||o.node;return NODE[id]?[{id,s:mapS(o.type||""),t:o.details||o.type}]:null}catch(_){return null}}).filter(Boolean);
 if(!rows.length)return;stop();steps=rows;cur=-1;$("#sl").max=rows.length-1;$("#vr").add(new Option("Live stream","__live"));$("#vr").value="__live";
 $("#log").replaceChildren(...rows.map((st,i)=>{const li=document.createElement("li");li.innerHTML=`<span class="dot s-${st[0].s}"></span><time>#${i+1}</time><span></span>`;li.lastChild.textContent=st[0].t;li.onclick=()=>go(i,false);return li}));paint()};
$("#vr").addEventListener("change",e=>{if(e.target.value==="__live")return});
build();requestAnimationFrame(loop);
</script></body></html>
