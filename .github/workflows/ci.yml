name: TIVIDY CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            libgl1-mesa-dev

      - name: Configure project
        run: |
          cmake -S . -B build \
            -DTIVIDY_BUILD_DESKTOP=ON

      - name: Build project
        run: |
          cmake --build build --target tividy_desktop -j2