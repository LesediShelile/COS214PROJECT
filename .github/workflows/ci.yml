
name: TIVIDY CI

on:
  push:
    branches:
      - main
      - development
      - chore/ci-pipeline
      - fix/integration-bugs
  pull_request:
    branches:
      - main
      - development

jobs:
  repository-check:
    name: Check repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project directories
        run: |
          test -d include
          test -d src
          test -d docs

      - name: Verify C++ source and header files
        shell: bash
        run: |
          # Ensure src contains only .cpp files
          if find src -type f ! -name '*.cpp' | grep -q .; then
            echo "Error: src contains files that are not .cpp files"
            find src -type f ! -name '*.cpp'
            exit 1
          fi

          # Ensure include contains only .h files
          if find include -type f ! -name '*.h' | grep -q .; then
            echo "Error: include contains files that are not .h files"
            find include -type f ! -name '*.h'
            exit 1
          fi

          # Ensure both directories contain at least one expected file
          test -n "$(find src -type f -name '*.cpp' -print -quit)"
          test -n "$(find include -type f -name '*.h' -print -quit)"

      - name: Set up CMake
        run: cmake -S . -B build -DTIVIDY_BUILD_TESTS=OFF

      - name: Build TIVIDY core library
        run: cmake --build build --target tividy_core --parallel 2
